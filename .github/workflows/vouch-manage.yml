name: Vouch (manage)

# Let maintainers vouch/denounce/unvouch by commenting on a Discussion:
#   !vouch                 vouch the discussion author
#   !vouch @user [reason]  vouch a specific user
#   !denounce [@user] [reason]
#   !unvouch [@user]
# Only collaborators with admin/maintain/write are honored.

on:
  discussion_comment:
    types: [created]

concurrency:
  group: vouch-manage
  cancel-in-progress: false

permissions:
  contents: write
  discussions: write
  id-token: write

jobs:
  # Chooses GitHub's runners or Coolify's for the jobs below; pick-runner.yml has the rules.
  pick-runner:
    permissions: {}
    uses: ./.github/workflows/pick-runner.yml
    with:
      untrusted: ${{ (github.event.pull_request.head.repo.fork || (github.event.issue.pull_request && !github.event.repository.private) || !contains(fromJSON('["","OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association || '')) && true || false }}
    secrets:
      billing-token: ${{ secrets.ACTIONS_BILLING_TOKEN }}

  manage:
    needs: pick-runner
    runs-on: ${{ fromJSON(github.run_attempt == 1 && needs.pick-runner.outputs.runs-on || needs.pick-runner.outputs.rerun-on) }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - uses: mitchellh/vouch/action/manage-by-discussion@v1
        with:
          discussion-number: ${{ github.event.discussion.number }}
          comment-node-id: ${{ github.event.comment.node_id }}
          vouch-keyword: '!vouch'
          denounce-keyword: '!denounce'
          unvouch-keyword: '!unvouch'
          roles: admin,maintain,write
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
